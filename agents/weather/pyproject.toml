[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "WeatherAgent"
version = "0.1.0"
description = "Agente especialista en pronosticos del clima (A2A)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] >= 0.3.0, < 0.4.0",
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[a2a] >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 2.2.0, < 3.0.0",
    "strands-agents >= 1.13.0",
    "weather-forecast-server >= 0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
